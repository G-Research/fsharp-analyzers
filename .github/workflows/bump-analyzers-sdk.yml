name: Bump FSharp.Analyzers.SDK

# Everything this does lives in bump-sdk.fsx, which is runnable with --dry-run on a laptop.
# The job only has to hand it a checkout, a .NET and a token.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

# A manual run and the scheduled one would otherwise race, both force-pushing the same branch
# and both opening or closing pull requests. Queue rather than cancel, so a run that is halfway
# through opening one is left to finish it.
concurrency:
  group: bump-analyzers-sdk
  cancel-in-progress: false

permissions:
  contents: write # to push the branch
  pull-requests: write # to open it
  issues: write # to create the automated label, which is an Issues API operation
  actions: write # to dispatch ci.yml on it

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A manual run can be dispatched from any branch, and the script branches off
          # whatever it finds checked out. main is what it opens the pull request against.
          ref: main
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      - name: Bump FSharp.Analyzers.SDK
        run: dotnet fsi bump-sdk.fsx
        env:
          GH_TOKEN: ${{ github.token }}
