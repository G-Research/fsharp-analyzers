name: CI

on:
  pull_request:
    branches:
      - main
  # A pull request opened with GITHUB_TOKEN does not start a workflow run, so
  # bump-analyzers-sdk.yml dispatches this one on its branch instead.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      - name: Build
        run: dotnet fsi build.fsx
